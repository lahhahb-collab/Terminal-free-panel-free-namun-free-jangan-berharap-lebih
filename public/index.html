<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Termux Web Terminal</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css" />
    <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Courier New', monospace;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        #terminal-container {
            flex: 1;
            padding: 4px;
            width: 100%;
        }
        #extra-keys {
            display: flex;
            background-color: #000000;
            padding: 6px;
            gap: 6px;
            overflow-x: auto;
            border-top: 1px solid #222;
        }
        .term-btn {
            background-color: #1c1c1c;
            color: #20c20e;
            border: 1px solid #333;
            padding: 8px 14px;
            font-size: 13px;
            font-family: monospace;
            border-radius: 4px;
            cursor: pointer;
            user-select: none;
            font-weight: bold;
        }
        .term-btn:active {
            background-color: #333;
            color: #fff;
        }
    </style>
</head>
<body>

    <div id="terminal-container"></div>

    <div id="extra-keys">
        <button class="term-btn" onclick="sendKey('\x1b')">ESC</button>
        <button class="term-btn" onclick="sendKey('\x03')">CTRL+C</button>
        <button class="term-btn" onclick="sendKey('\t')">TAB</button>
        <button class="term-btn" onclick="sendKey('\x1b[A')">↑</button>
        <button class="term-btn" onclick="sendKey('\x1b[B')">↓</button>
        <button class="term-btn" onclick="sendKey('\x1b[D')">←</button>
        <button class="term-btn" onclick="sendKey('\x1b[C')">→</button>
        <button class="term-btn" onclick="sendKey('-')">-</button>
        <button class="term-btn" onclick="sendKey('/')">/</button>
    </div>

    <script>
        const term = new Terminal({
            cursorBlink: true,
            theme: {
                background: '#000000',
                foreground: '#ffffff',
                cursor: '#028200',
                selectionBackground: '#444444',
                black: '#000000',
                green: '#028200',
                brightGreen: '#20c20e'
            },
            fontFamily: 'monospace',
            fontSize: 14
        });

        const fitAddon = new FitAddon.FitAddon();
        term.loadAddon(fitAddon);
        term.open(document.getElementById('terminal-container'));
        fitAddon.fit();

        // Hubungkan WebSocket otomatis
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const ws = new WebSocket(`${protocol}//${window.location.host}`);

        ws.onopen = () => {
            // Sampaikan ukuran layar terminal ke server
            ws.send(`RESIZE:${term.cols}:${term.rows}`);
        };

        ws.onmessage = (event) => {
            term.write(event.data);
        };

        ws.onclose = () => {
            term.write('\r\n\x1b[31m[Koneksi Terminal Terputus]\x1b[0m\r\n');
        };

        term.onData((data) => {
            if (ws.readyState === WebSocket.OPEN) {
                ws.send(data);
            }
        });

        window.addEventListener('resize', () => {
            fitAddon.fit();
            if (ws.readyState === WebSocket.OPEN) {
                ws.send(`RESIZE:${term.cols}:${term.rows}`);
            }
        });

        function sendKey(key) {
            if (ws.readyState === WebSocket.OPEN) {
                ws.send(key);
            }
        }
    </script>
</body>
</html>
