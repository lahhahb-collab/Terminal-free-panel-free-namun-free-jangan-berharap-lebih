<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Termux Web Terminal</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css" />
    <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Courier New', monospace;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        #terminal-container {
            flex: 1;
            padding: 4px;
            width: 100%;
        }
        #extra-keys {
            display: flex;
            background-color: #0d0d0d;
            padding: 6px;
            gap: 5px;
            overflow-x: auto;
            border-top: 1px solid #222;
            white-space: nowrap;
        }
        .term-btn {
            background-color: #1c1c1c;
            color: #20c20e;
            border: 1px solid #333;
            padding: 8px 12px;
            font-size: 12px;
            font-family: monospace;
            border-radius: 4px;
            cursor: pointer;
            user-select: none;
            font-weight: bold;
            min-width: 40px;
            text-align: center;
        }
        .term-btn:active, .term-btn.active {
            background-color: #028200;
            color: #ffffff;
        }
    </style>
</head>
<body>

    <div id="terminal-container"></div>

    <!-- Extra Keys Termux Lengkap -->
    <div id="extra-keys">
        <button class="term-btn" id="ctrl-btn" onclick="toggleCtrl()">CTRL</button>
        <button class="term-btn" onclick="sendKey('\x1b')">ESC</button>
        <button class="term-btn" onclick="sendKey('\t')">TAB</button>
        <button class="term-btn" onclick="sendCtrlKey('c')">CTRL+C</button>
        <button class="term-btn" onclick="sendCtrlKey('o')">CTRL+O</button>
        <button class="term-btn" onclick="sendCtrlKey('x')">CTRL+X</button>
        <button class="term-btn" onclick="sendKey('\x1b[A')">↑</button>
        <button class="term-btn" onclick="sendKey('\x1b[B')">↓</button>
        <button class="term-btn" onclick="sendKey('\x1b[D')">←</button>
        <button class="term-btn" onclick="sendKey('\x1b[C')">→</button>
        <button class="term-btn" onclick="sendKey('~')">~</button>
        <button class="term-btn" onclick="sendKey('-')">-</button>
        <button class="term-btn" onclick="sendKey('/')">/</button>
    </div>

    <script>
        let ctrlActive = false;

        const term = new Terminal({
            cursorBlink: true,
            theme: {
                background: '#000000',
                foreground: '#ffffff',
                cursor: '#028200',
                selectionBackground: '#444444',
                black: '#000000',
                green: '#028200',
                brightGreen: '#20c20e'
            },
            fontFamily: 'monospace',
            fontSize: 14
        });

        const fitAddon = new FitAddon.FitAddon();
        term.loadAddon(fitAddon);
        term.open(document.getElementById('terminal-container'));
        fitAddon.fit();

        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const ws = new WebSocket(`${protocol}//${window.location.host}`);

        ws.onopen = () => {
            ws.send(`RESIZE:${term.cols}:${term.rows}`);
            
            // Auto Restore File Sync dari LocalStorage saat koneksi terbuka
            syncLocalFilesToServer();
        };

        ws.onmessage = (event) => {
            term.write(event.data);
        };

        ws.onclose = () => {
            term.write('\r\n\x1b[31m[Koneksi Terminal Terputus]\x1b[0m\r\n');
        };

        // Penanganan Input Keyboard & Modifikasi CTRL Modifier
        term.onData((data) => {
            if (ws.readyState === WebSocket.OPEN) {
                if (ctrlActive) {
                    const charCode = data.charCodeAt(0);
                    if (charCode >= 97 && charCode <= 122) { // a-z
                        sendCtrlKey(data);
                    } else {
                        ws.send(data);
                    }
                    toggleCtrl(false); // Reset CTRL setelah ditekan
                } else {
                    ws.send(data);
                }
            }
        });

        window.addEventListener('resize', () => {
            fitAddon.fit();
            if (ws.readyState === WebSocket.OPEN) {
                ws.send(`RESIZE:${term.cols}:${term.rows}`);
            }
        });

        // Fitur Tombol Termux & CTRL
        function toggleCtrl(forceState) {
            ctrlActive = forceState !== undefined ? forceState : !ctrlActive;
            const btn = document.getElementById('ctrl-btn');
            if (ctrlActive) {
                btn.classList.add('active');
            } else {
                btn.classList.remove('active');
            }
        }

        function sendKey(key) {
            if (ws.readyState === WebSocket.OPEN) {
                ws.send(key);
            }
        }

        function sendCtrlKey(letter) {
            if (ws.readyState === WebSocket.OPEN) {
                const code = letter.toLowerCase().charCodeAt(0) - 96;
                ws.send(String.fromCharCode(code));
            }
        }

        // Auto Save LocalStorage System
        function syncLocalFilesToServer() {
            const savedFiles = JSON.parse(localStorage.getItem('termux_files') || '{}');
            for (const [filename, content] of Object.entries(savedFiles)) {
                // Tulis file secara otomatis ke server environment
                ws.send(`cat << 'EOF' > ${filename}\n${content}\nEOF\n`);
            }
        }

        // Menyimpan status ketikan ke LocalStorage saat keluar nano/simpan
        window.saveFileToLocal = function(filename, content) {
            const savedFiles = JSON.parse(localStorage.getItem('termux_files') || '{}');
            savedFiles[filename] = content;
            localStorage.setItem('termux_files', JSON.stringify(savedFiles));
        };
    </script>
</body>
</html>
